<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小红书图文预览</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1677FF',
            sidebar: '#1E293B',
            sidebarText: '#F1F5F9',
          },
        },
      }
    }

    // 格式化数字单位（K/M）
    function formatNumber(num) {
      if (num >= 1000000) {
        return (num / 1000000).toFixed(2) + 'M';
      } else if (num >= 1000) {
        return (num / 1000).toFixed(2) + 'K';
      } else {
        return num.toString();
      }
    }

    // 页面加载后初始化数字展示
    document.addEventListener('DOMContentLoaded', function() {
      // 示例数值：点赞2.3万=23000，评论1240，收藏5.6k=5600，转发980
      document.getElementById('likeCount').textContent = formatNumber(23000);
      document.getElementById('commentCount').textContent = formatNumber(1240);
      document.getElementById('collectCount').textContent = formatNumber(5600);
      document.getElementById('shareCount').textContent = formatNumber(980);
    });
  </script>
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .carousel-container {
      overflow: hidden;
      position: relative;
    }
    .carousel-slide {
      display: flex;
      transition: transform 0.3s ease;
    }
    .carousel-item {
      flex: 0 0 100%;
      width: 100%;
    }
  </style>
</head>
<body class="bg-gray-50 font-sans h-screen overflow-hidden">

<div class="flex h-full">
  <!-- 左侧导航栏 -->
  <aside class="w-64 bg-sidebar text-sidebarText h-full overflow-y-auto scrollbar-hide">
    <div class="p-4 border-b border-gray-600 font-semibold text-white">社交营销系统</div>
    <nav class="p-2 text-sm">
      <div class="text-xs text-gray-400 px-2 py-1">基础管理</div>
      <div class="px-2 py-1 hover:bg-primary/20 rounded">基础管理</div>
      <div class="px-2 py-1 hover:bg-primary/20 rounded">转化承接</div>
      <div class="px-2 py-1 hover:bg-primary/20 rounded">内容生产管理</div>
      <div class="px-2 py-1 hover:bg-primary/20 rounded">KOC管理</div>
      <div class="px-2 py-1 hover:bg-primary/20 rounded">投流管理</div>
      <div class="px-2 py-1 hover:bg-primary/20 rounded">AI生产中心</div>
      <div class="px-2 py-1 hover:bg-primary/20 rounded">内容审核</div>
      <div class="px-2 py-1 hover:bg-primary/20 rounded">生产策略管理</div>

      <div class="text-xs text-gray-400 px-2 py-1 mt-4">内容中台</div>
      <div class="px-3 py-2 bg-primary/30 rounded text-white flex items-center">
        <i class="fa fa-database mr-2"></i>内容库
      </div>
      <div class="px-3 py-2 hover:bg-primary/20 rounded flex items-center">
        <i class="fa fa-tags mr-2"></i>标签管理
      </div>
    </nav>
  </aside>

  <!-- 右侧内容区 -->
  <div class="flex-1 flex flex-col overflow-y-auto">
    <div class="h-14 bg-white border-b flex items-center px-4">
      <button onclick="window.close()" class="flex items-center text-sm hover:text-primary">
        <i class="fa fa-arrow-left mr-1"></i>返回列表
      </button>
      <div class="ml-4 font-medium">小红书图文预览</div>
    </div>

    <div class="p-6 max-w-5xl mx-auto w-full">
      <div class="bg-white rounded-lg shadow p-6">

        <!-- 轮播图区域 -->
        <div class="carousel-container relative rounded overflow-hidden mb-6">
          <div class="carousel-slide" id="carouselSlide">
            <div class="carousel-item"><img src="https://picsum.photos/600/800?random=1" class="w-full h-96 object-cover"></div>
            <div class="carousel-item"><img src="https://picsum.photos/600/800?random=2" class="w-full h-96 object-cover"></div>
            <div class="carousel-item"><img src="https://picsum.photos/600/800?random=3" class="w-full h-96 object-cover"></div>
            <div class="carousel-item"><img src="https://picsum.photos/600/800?random=4" class="w-full h-96 object-cover"></div>
          </div>

          <!-- 页码显示 -->
          <div class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-2 py-1 rounded-full">
            <span id="currentPage">1</span> / <span id="totalPage">4</span>
          </div>
        </div>

        <!-- 标题 -->
        <div class="text-lg font-medium mb-3">
          杭州西湖五星酒店推荐｜住一次就爱上
        </div>

        <!-- 互动数据 -->
        <div class="flex items-center gap-6 text-sm text-gray-600 mb-6">
          <div class="flex items-center gap-1">
            <i class="fa fa-thumbs-up text-primary"></i>
            <span>点赞 <span id="likeCount">0</span></span>
          </div>
          <div class="flex items-center gap-1">
            <i class="fa fa-comment"></i>
            <span>评论 <span id="commentCount">0</span></span>
          </div>
          <div class="flex items-center gap-1">
            <i class="fa fa-star"></i>
            <span>收藏 <span id="collectCount">0</span></span>
          </div>
          <div class="flex items-center gap-1">
            <i class="fa fa-share-alt"></i>
            <span>转发 <span id="shareCount">0</span></span>
          </div>
        </div>

        <!-- 基础信息 -->
        <div class="bg-gray-50 p-4 rounded border mb-6 grid grid-cols-2 gap-3 text-sm">
          <div><span class="text-gray-500">内容ID：</span>1011</div>
          <div><span class="text-gray-500">业务内容ID：</span>BN1011001</div>
          <div><span class="text-gray-500">发布平台：</span>小红书</div>
          <div><span class="text-gray-500">发布时间：</span>2026-04-10</div>
          <div><span class="text-gray-500">内容来源：</span>图文团队</div>
        </div>

        <!-- 按钮 -->
        <div class="flex justify-end gap-3">
          <button onclick="window.close()" class="border px-4 py-2 rounded text-sm">关闭预览</button>
          <button class="bg-primary text-white px-4 py-2 rounded text-sm hover:bg-primary/90">
            <i class="fa fa-download mr-1"></i>下载图文
          </button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const slide = document.getElementById('carouselSlide');
  const items = document.querySelectorAll('.carousel-item');
  const currentPageEl = document.getElementById('currentPage');
  const totalPageEl = document.getElementById('totalPage');
  let currentIndex = 0;
  const total = items.length;

  totalPageEl.textContent = total;

  // 滑动逻辑
  let startX = 0;
  let isDragging = false;

  slide.addEventListener('mousedown', (e) => {
    startX = e.clientX;
    isDragging = true;
  });

  slide.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
  });

  slide.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    const diff = e.clientX - startX;
    if (diff < -50) {
      next();
    } else if (diff > 50) {
      prev();
    }
    isDragging = false;
  });

  slide.addEventListener('mouseleave', () => {
    isDragging = false;
  });

  function next() {
    if (currentIndex >= total - 1) return;
    currentIndex++;
    update();
  }

  function prev() {
    if (currentIndex <= 0) return;
    currentIndex--;
    update();
  }

  function update() {
    slide.style.transform = `translateX(-${currentIndex * 100}%)`;
    currentPageEl.textContent = currentIndex + 1;
  }
</script>

</body>
</html>
